title = Unchanged Datum Filter
desc = This component provides a way to discard unchanging datum from a datum stream.

unchangedPublishMaxSeconds.key = Unchanged Max Seconds
unchangedPublishMaxSeconds.desc = When greater than <code>0</code> then the maximum number of seconds \
	to refrain from publishing an unchanged datum within a single datum stream (source ID).

propertyIncludePatternValue.key = Property Pattern
propertyIncludePatternValue.desc = A property name \
	<a href="https://docs.oracle.com/en/java/javase/11/docs/api/java.base/java/util/regex/Pattern.html" target="_blank">pattern <i class="bi bi-box-arrow-up-right"></i></a> \
	that limits the properties monitored for changes. Only property names that match this expression will be \
	considered when determining if a datum differs from the previous datum within the datum stream.

debounceThresholdMillis.key = Debounce Threshold
debounceThresholdMillis.desc = When greater than <code>0</code> then the minimum number of milliseconds \
	a changed datum must remain unchanged before it is published, as counted by the <b>Debounce Mode</b>. \
	Changes that revert before this threshold elapses are discarded. If <b>Unchanged Max Seconds</b> elapses \
	while a change is not yet stable, the datum is published with the monitored properties set to their last \
	published values. Best used with a <b>Property Pattern</b> that limits the monitored properties to \
	status-like values.

debounceModeName.key = Debounce Mode
debounceModeName.desc = How time is counted towards the <b>Debounce Threshold</b>. <b>Consecutive</b> \
	requires a changed value to be seen continuously for the entire threshold. <b>Integrator</b> counts time \
	at a changed value towards the threshold, and time back at the previously published value against it, \
	so that occasional reversions only delay a change rather than restart it.

debounceMode.Consecutive = Consecutive
debounceMode.Integrator = Integrator (net time)
