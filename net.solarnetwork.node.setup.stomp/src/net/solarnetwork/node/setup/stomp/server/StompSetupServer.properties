title = Setup Server (STOMP)
desc = Provides a setup integration server using the STOMP protocol.

status.key = Status
status.desc = Server status information.

bindAddress.key = Bind Address
bindAddress.desc = The IP address or host name to listen on. Set to <code>0.0.0.0</code> to \
	listen on all available addresses. Defaults to <code>127.0.0.1</code> (localhost).
	
port.key = Port
port.desc = The port number to listen on. The default port is <code>8780</code>.

liveOpMode.key = Live Mode
liveOpMode.desc = The operational mode to enable while a client is subscribed to live datum \
	(the <code>/setup/datum/live</code> destination). Configure a <b>Datum Data Source \
	Operational Mode Invoker</b> to poll data sources while this mode is active. Defaults to \
	<code>setup-live</code>.

liveMaxDurationMins.key = Live Max Duration
liveMaxDurationMins.desc = The maximum number of minutes a live datum subscription can last \
	before it is ended.
