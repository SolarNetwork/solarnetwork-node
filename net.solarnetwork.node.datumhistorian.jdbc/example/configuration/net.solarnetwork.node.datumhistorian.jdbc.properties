###############################################################################
# net.solarnetwork.node.datumhistorian.jdbc Configuration Admin properties
###############################################################################

###############################################################################
# JdbcDatumHistorian.fetchSize <integer>
#
# The number of datum rows the JDBC driver reads at a time from the results of
# a datum query, or 0 for the driver default. The higher the value the more
# memory that will be required, but the fewer round trips to the database.
# The Postgres driver only reads results a page at a time within a
# transaction, as the datum stream queries are run.

JdbcDatumHistorian.fetchSize = 100

###############################################################################
# JdbcDatumHistorian.maxMinuteAggregationHours <integer>
#
# The longest time span, in hours, of a FiveMinute, TenMinute, FifteenMinute
# or ThirtyMinute aggregation query; a query over a longer span is refused, as
# SolarNet refuses it. These aggregates are computed from every raw datum of
# the span when queried, so the cost grows with the span. The default of 840
# hours (five weeks) is SolarNet's, so that a whole month can be queried. Use 0
# for no limit. Sub-hour aggregation needs the aggregate setup of
# postgres-init-agg.sql.

JdbcDatumHistorian.maxMinuteAggregationHours = 840
