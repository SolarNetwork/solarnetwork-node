###############################################################################
# net.solarnetwork.node.datumhistorian.jdbc Configuration Admin properties
###############################################################################

###############################################################################
# JdbcDatumHistorian.fetchSize <integer>
#
# The number of datum rows the JDBC driver reads at a time from the results of
# a datum query, or 0 for the driver default. The higher the value the more
# memory that will be required, but the fewer round trips to the database.
# The Postgres driver only reads results a page at a time within a
# transaction, as the datum stream queries are run.

JdbcDatumHistorian.fetchSize = 100
