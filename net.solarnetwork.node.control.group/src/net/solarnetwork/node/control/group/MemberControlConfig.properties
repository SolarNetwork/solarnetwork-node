controlId.key = Control
controlId.desc = The ID of the control to manage.

parametersValue.key = Parameters
parametersValue.desc = Optional parameters to pass to the group strategies, as a comma-delimited list of equal-delimited \
	key value pairs. For example <code>portion=0.2, priority=10</code>.

disabled.key = Disabled
disabled.desc = When active this member configuration will be ignored. This might be useful if a specific \
	control is temporarily unavailable, such as during a prolonged equipment failure. <b>Note</b> \
	this can impact the coordination strategy outcome. For example the <b>Simple</b> strategy \
	with a <code>Float</code> or <code>Integer</code> control type will allocate larger \
	portions to the remaining non-disabled members because there will be fewer members \
	to distribute the control value across.
