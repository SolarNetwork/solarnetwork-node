title = Control Group

controlId.key = Control ID
controlId.desc = The control ID to use for the group.

controlPropertyTypeKey.key = Control Type
controlPropertyTypeKey.desc = The type of control this group should operate as.

controlPropertyName.key = Property Name
controlPropertyName.desc = An optional property name this control group should use.

controlUnit.key = Control Unit
controlUnit.desc = An optional unit of measurement this control group should report as.

controlReadOnly.key = Read Only
controlReadOnly.desc = If enabled then do not allow updating the control group value.

instructionTopicsValue.key = Instruction Topics
instructionTopicsValue.desc = A comma-delimited list of instruction topics to respond to.

coordinationStrategyUid.key = Coordination Strategy
coordinationStrategyUid.desc = The <b>Service Name</b> of a deployed <b>Coordination Strategy</b> \
	to use for deciding how to distribute and combine the member controls of this group.

consensusStrategyUid.key = Consensus Strategy
consensusStrategyUid.desc = The <b>Service Name</b> of a deployed <b>Consensus Strategy</b> \
	to use for deciding how to handle member control state changes within this group.

memberConfigs.key = Member Configurations
memberConfigs.desc = A list of member control configurations that contribute to this group.

error.update.controlReadOnly = Control can not be updated as it is read-only.
error.update.notDistributed = The control update was not handled by the configured coordination strategy.
error.update.exception = An exception occurred updating the member controls: {0}
error.update.noExecutionService = No InstructionExecutionService is available.

error.coordinationStrategyNotConfigured = Coordination Strategy setting not configured.
error.coordinationStrategyNotAvailable = Configured Coordination Strategy [{0}] not available.
error.consensusStrategyNotConfigured = Consensus Strategy setting not configured.
error.consensusStrategyNotAvailable = Configured Consensus Strategy [{0}] not available.
