title = Control Conductor
desc = Schedule and execute sets of control changes.

predicate.expression.key = Predicate Expression
predicate.expression.desc = An optional expression that must evaluate to true for the \
	<code>OrchestrateControls</code> instruction to execute the configured tasks.

predicate.expressionServiceId.key = Predicate Expression Language
predicate.expressionServiceId.desc = The expression language to write <b>Predicate Expression</b> in.
	
taskConfigs.key = Task Configurations
taskConfigs.desc = A list of  control task configurations that determine the control values to change \
	and the schedule at which to change them.
