title = Bluetooth Setup
desc = Control when the Bluetooth setup radio is on. By default it is always on.

status.key = Status
status.desc = The current radio state and why it is on.

enableMinutes.key = Override For
enableMinutes.desc = Minutes to turn the radio on for, starting now. Returns to <code>0</code> \
	once applied.

alwaysOn.key = Always On
alwaysOn.desc = Keep the radio on at all times. Turn off to make it available only on the \
	<b>Schedule</b>, while the <b>Override Mode</b> is active, or while the network is offline.

schedule.key = Schedule
schedule.desc = The availability rules, as tariff schedule CSV: the header row \
	<code>Month,Day,Weekday,Time,Available</code>, then one rule per line, such as \
	<code>,,Mon-Fri,07:00-18:00,1</code>. The first matching rule decides. An invalid schedule \
	never applies.

timeZone.key = Time Zone
timeZone.desc = The time zone to evaluate the schedule in, such as <code>Pacific/Auckland</code>. \
	Leave empty for the system zone.

metadataServiceUid.key = Metadata Service
metadataServiceUid.desc = The metadata service to read the schedule from, or the \
	<b>Service Name</b> of a User Metadata Service.

metadataPath.key = Metadata Path
metadataPath.desc = The metadata path to read the schedule from, such as \
	<code>/pm/bluetooth/schedule</code>. When loaded, it replaces the <b>Schedule</b> setting. \
	Leave empty to use only the <b>Schedule</b> setting.

opMode.key = Override Mode
opMode.desc = The operational mode that turns the radio on while it is active.

defaultDurationSeconds.key = Override Duration
defaultDurationSeconds.desc = Seconds an <code>enable</code> request lasts when it has no \
	duration.

maxDurationSeconds.key = Maximum Override
maxDurationSeconds.desc = The longest an <code>enable</code> request can last, in seconds. Use \
	<code>0</code> for no limit.

offlineTriggerEnabled.key = Offline Trigger
offlineTriggerEnabled.desc = Turn the radio on once the <b>Offline Mode</b> has been active for \
	<b>Offline Threshold</b> minutes. Requires an HTTP Ping control whose <b>Failure Op Mode</b> \
	matches.

offlineThresholdMinutes.key = Offline Threshold
offlineThresholdMinutes.desc = Minutes the <b>Offline Mode</b> must be active before the radio \
	turns on.

onlineGraceMinutes.key = Online Grace
onlineGraceMinutes.desc = Minutes to keep the radio on after the <b>Offline Mode</b> clears.

watchdogIntervalSeconds.key = Check Interval
watchdogIntervalSeconds.desc = Seconds between checks of the <b>Offline Mode</b> and the radio \
	state. Use <code>0</code> to disable them and the offline trigger.

offlineOpMode.key = Offline Mode
offlineOpMode.desc = The operational mode that means the network is offline, as set by an HTTP \
	Ping control. Leave empty to disable the offline trigger.

command.key = Command
command.desc = The <code>solarcfg</code> command.

commandTimeoutSeconds.key = Command Timeout
commandTimeoutSeconds.desc = Seconds to wait for the command before killing it.

status.on = On
status.off = Off
status.unknown = Unknown
status.alwaysOn = always on
status.opMode = operational mode ''{0}'' active until {1}
status.noExpiry = no expiry
status.offline = offline mode ''{0}'' active since {1}
status.offlinePending = offline mode ''{0}'' active since {1}; radio turns on at {2}
status.schedule = schedule ''{0}'' ({1}) allows until {2}
status.scheduleNext = schedule ''{0}'' ({1}) next allows at {2}
status.scheduleNextNone = schedule ''{0}'' ({1}) has no window within the next year
status.scheduleInvalid = schedule invalid: {0}
status.scheduleMetadata = schedule from metadata ''{0}''
status.scheduleMetadataNotLoaded = metadata schedule ''{0}'' not loaded ({1}), using setting
status.scheduleMetadataStale = metadata schedule ''{0}'' unavailable ({1}), keeping the last result

error.unsupportedAction = Unsupported bluetooth action ''{0}''. Supported actions are 'status', 'enable', 'disable', and 'restart'.
