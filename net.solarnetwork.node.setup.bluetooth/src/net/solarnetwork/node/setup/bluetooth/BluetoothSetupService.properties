title = Bluetooth Setup
desc = Control when the Bluetooth setup radio is on. By default it is always on. Turn \
	<b>Always On</b> off to make the radio available only on the <b>Schedule</b>, while the \
	override operational mode is active, or while the network has been offline for a period \
	of time.

status.key = Status
status.desc = The current Bluetooth setup radio state and why it is on.

enableMinutes.key = Override For
enableMinutes.desc = Enter a number of minutes to turn the radio on for now, regardless of the \
	schedule, by enabling the override operational mode with an expiration. The value returns \
	to <code>0</code> once applied.

alwaysOn.key = Always On
alwaysOn.desc = Keep the radio on at all times (the default). Turn off to make the radio \
	available only on the <b>Schedule</b>, while the override operational mode is active, or \
	while the network is offline.

schedule.key = Schedule
schedule.desc = The times the radio is available when <b>Always On</b> is off, as tariff \
	schedule CSV. Start with the header row <code>Month,Day,Weekday,Time,Available</code>, then \
	add one rule per line, such as <code>,,Mon-Fri,07:00-18:00,1</code>. An empty cell means \
	any. Times are <code>HH:MM-HH:MM</code> with an exclusive end, in the <b>Time Zone</b>. \
	<code>Available</code> is <code>1</code> or <code>0</code>; the first rule that matches \
	decides, so a <code>0</code> rule placed first is a blackout. Ranges must be ascending. An \
	invalid schedule never applies. When <b>Metadata Path</b> is set, a schedule loaded from \
	metadata replaces this one; this one still applies until metadata loads, including after a \
	restart without network, so leave it empty or make it no wider than the metadata schedule.

timeZone.key = Time Zone
timeZone.desc = The time zone ID to evaluate the schedule in, such as \
	<code>Pacific/Auckland</code>. Leave empty for the node system zone, which on many \
	SolarNodeOS images is UTC. An invalid zone means the schedule never applies.

metadataServiceUid.key = Metadata Service
metadataServiceUid.desc = The metadata service to read the schedule from: \
	<code>Node Metadata Service</code> for node metadata, or the <b>Service Name</b> of a User \
	Metadata Service component.

metadataPath.key = Metadata Path
metadataPath.desc = The metadata path to read the schedule from, such as \
	<code>/pm/bluetooth/schedule</code>, holding the same CSV as a string or as an array of rows. \
	Leave empty to use only the <b>Schedule</b> setting.

opMode.key = Override Mode
opMode.desc = The operational mode that turns the radio on while it is active, regardless of \
	the schedule. Enable it from SolarNetwork with the \
	<code>EnableOperationalModes</code> instruction and an <code>Expiration</code>.

defaultDurationSeconds.key = Override Duration
defaultDurationSeconds.desc = The number of seconds to turn the radio on for when an \
	<code>enable</code> request does not include a duration.

maxDurationSeconds.key = Maximum Override
maxDurationSeconds.desc = The maximum number of seconds the radio can be turned on for in a \
	single <code>enable</code> request. Use <code>0</code> for no limit.

offlineTriggerEnabled.key = Offline Trigger
offlineTriggerEnabled.desc = Toggle on to turn the radio on automatically while the \
	<b>Offline Mode</b> operational mode is active. Requires an HTTP Ping control whose \
	<b>Failure Op Mode</b> matches <b>Offline Mode</b>, for example from the \
	<code>solarnode-config-ping</code> package; without one the trigger never fires.

offlineThresholdMinutes.key = Offline Threshold
offlineThresholdMinutes.desc = The number of minutes the <b>Offline Mode</b> must be active \
	before the radio turns on.

onlineGraceMinutes.key = Online Grace
onlineGraceMinutes.desc = The number of minutes to keep the radio on after the \
	<b>Offline Mode</b> becomes inactive.

watchdogIntervalSeconds.key = Check Interval
watchdogIntervalSeconds.desc = The number of seconds between checks of the <b>Offline Mode</b> \
	and the radio state. Use <code>0</code> to disable the checks, which also disables the \
	offline trigger. This does not affect the schedule, which is checked every 15 seconds.

offlineOpMode.key = Offline Mode
offlineOpMode.desc = The operational mode that means the network is offline: by default \
	<code>net-offline</code>, which an HTTP Ping control enables when it cannot reach its URL. \
	Use a single mode name; a <code>!</code> prefix is not supported. Leave empty to disable \
	the offline trigger. Requires an HTTP Ping control whose <b>Failure Op Mode</b> matches, \
	for example from the <code>solarnode-config-ping</code> package.

command.key = Command
command.desc = The <code>solarcfg</code> system command to execute.

commandTimeoutSeconds.key = Command Timeout
commandTimeoutSeconds.desc = The maximum number of seconds to wait for the <code>solarcfg</code> \
	command to complete before giving up on it.

status.on = On
status.off = Off
status.unknown = Unknown
